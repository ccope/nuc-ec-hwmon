PACKAGE_NAME="nuc-ec-hwmon"
PACKAGE_VERSION="0.6"

BUILT_MODULE_NAME[0]="nuc_ec_hwmon"
DEST_MODULE_LOCATION[0]="/kernel/drivers/hwmon"

MAKE[0]="make KVER=${kernelver} KDIR=/lib/modules/${kernelver}/build"
CLEAN="make KVER=${kernelver} KDIR=/lib/modules/${kernelver}/build clean"

# Rebuild automatically on every kernel upgrade. Without this the sensors
# silently vanish after the next apt upgrade + reboot.
AUTOINSTALL="yes"
